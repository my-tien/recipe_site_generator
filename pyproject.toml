[tool.poetry]
name = "recipe_site_generator"
version = "1.0"
description = "Generates browser documents from input recipe files"
authors = ["My-Tien Nguyen <my-tien@mails.taipei>"]
license = "MIT"
readme = "README.md"
include = [
    "recipe_site_generator/templates/recipe_template.jinja"
]

[tool.poetry.dependencies]
python = "^3.9.6"
tabulate = "0.9.0"
PyYAML = "6.0.1"
jinja2 = "^3.1.6"
markdown = "^3.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
generate_gemtext_recipes = "recipe_site_generator.generate_gemtext:main"
generate_html_recipes = "recipe_site_generator.generate_html:main"
